name: First Pipeline
on: 
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Hello World
        run: echo "Hello CI/CD"
      - name: Checkout
        uses: actions/checkout@v4
        with:
          node-version: 24

      - name: Set up Java
        uses: actions/setup-java@v5 
        with:
          java-version: '17'
          distribution: 'temurin'    
      - name: Build 
        run: mvn compile
      - name: Run tests
        run: mvn clean test

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: deploy with secret
        env:
          DEPLOY_TOKEN: ${{secrets.FAKE_TOKEN}}
        run:
          echo "Deploying with secret..."









