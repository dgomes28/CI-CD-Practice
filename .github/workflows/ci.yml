name: First Pipeline
on: 
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Hello World
        run: echo "Hello CI/CD"
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5 
        with:
          java-version: '17'
          distribution: 'temurin'    
      - name: Build 
        run: mvn compile
      
#      - name: Run
#        run: mvn exec:java -Dexec.mainClass="Calculator"

  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          node-version: '20'
      - name: Run tests
        run: mvn clean test





