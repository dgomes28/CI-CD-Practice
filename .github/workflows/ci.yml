name: First Pipeline
on: 
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Hello World
        run: echo "Hello CI/CD"
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5 
        with:
          java-version: '17'
          distribution: 'temurin'    
      - name: Build 
        run: mvn compile
      - name: Run tests
        run: mvn clean test
      - name: Docker build
        run: docker build -t app .
      - name: Docker run
        run: |
          docker run -d --name app -p 8080:8080 app
          sleep 5
          curl --fail http://localhost:8080/health
          docker stop app
          docker rm app
        

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
